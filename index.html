<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego Simple</title>

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
text-align:center;
}
#game{
padding:20px;
}
#room{
margin:20px auto;
width:90%;
height:200px;
background:#333;
border:4px solid #777;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}
button{
width:70px;
height:70px;
margin:5px;
font-size:20px;
background:#222;
color:white;
border:2px solid white;
}
</style>
</head>

<body>

<div id="game">
<h2>Exploración simple</h2>

<div id="room">
Estás en la sala (0, 0)
</div>

<div>
<button onclick="move(0,-1)">⬆️</button>
</div>
<div>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(0,1)">⬇️</button>
<button onclick="move(1,0)">➡️</button>
</div>
</div>

<script>
let x = 0;
let y = 0;

function move(dx, dy){
x += dx;
y += dy;

document.getElementById("room").innerText =
"Estás en la sala (" + x + ", " + y + ")";

let room = document.getElementById("room");

// Cambia color según la zona
if((x + y) % 2 === 0){
room.style.background = "#444";
} else {
room.style.background = "#222";
}
}
</script>

</body>
</html>
